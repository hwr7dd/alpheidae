# Example only — do NOT commit a real token.
# Create the live secret locally (gitignored as deploy/k8s/secret.yaml):
#
#   kubectl -n blitz create secret generic blitz-api-auth \
#     --from-literal=BLITZ_API_TOKEN="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml > deploy/k8s/secret.yaml
#
# Or copy this file to secret.yaml and replace the token, then apply.

apiVersion: v1
kind: Secret
metadata:
  name: blitz-api-auth
  namespace: blitz
type: Opaque
stringData:
  BLITZ_API_TOKEN: "REPLACE_WITH_RANDOM_TOKEN"
